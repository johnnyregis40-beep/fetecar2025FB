<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise Califórnia</title>
<style>
  body {
    background-color: #0d1117;
    color: #c9d1d9;
    font-family: 'Consolas', monospace;
    padding: 40px;
  }

  .terminal {
    background-color: #161b22;
    border-radius: 10px;
    padding: 20px;
    max-width: 600px;
    margin: auto;
    box-shadow: 0 0 10px rgba(88, 166, 255, 0.2);
  }

  .texto {
    color: #58a6ff;
    margin-bottom: 15px;
    font-size: 18px;
    white-space: pre-line;
  }

  select, input, button {
    background-color: #0d1117;
    color: #c9d1d9;
    border: 1px solid #58a6ff;
    border-radius: 5px;
    padding: 10px;
    width: 100%;
    margin-top: 10px;
    font-size: 16px;
  }

  select option {
    background-color: #161b22;
    color: #c9d1d9;
  }

  button:hover {
    background-color: #58a6ff;
    color: #0d1117;
    cursor: pointer;
  }

  .barra-container {
    background-color: #2e2e2e;
    border-radius: 10px;
    height: 12px;
    margin-top: 8px;
    overflow: hidden;
  }

  .barra {
    height: 100%;
    width: 0;
    border-radius: 10px;
    transition: width 2s ease-in-out;
  }

  .verde { background-color: #2ea043; }
  .azul { background-color: #58a6ff; }

  .resultado {
    margin-top: 20px;
    font-size: 16px;
  }

  .chance {
    font-weight: bold;
    margin-top: 10px;
  }

  .hidden {
    display: none;
  }
</style>
</head>
<body>
  <div class="terminal">
    <div class="texto" id="texto">Olá! Bem-vindo à Análise Social da Califórnia.<br><br>Qual é o seu nome?</div>
    <input type="text" id="nomeInput" placeholder="Digite seu nome aqui...">
    <button id="nomeBtn" onclick="perguntaEtnia()">Continuar</button>

    <div id="etniaDiv" class="hidden">
      <div class="texto">1️⃣ Escolha sua etnia:</div>
      <select id="etnia">
        <option value="34.7">1 - Branco </option>
        <option value="5.4">2 - Negro / Afro-americano </option>
        <option value="15.1">3 - Asiático </option>
        <option value="0.8">4 - Indígena / Nativo </option>
      </select>
      <button onclick="perguntaCidade()">Próximo</button>
    </div>

    <div id="cidadeDiv" class="hidden">
      <div class="texto">2️⃣ Escolha sua cidade:</div>
      <select id="cidade">
        <!-- Cidades pobres = porcentagens menores -->
        <option value="35">1 - Mendota </option>
        <option value="30">2 - East Bakersfield </option>
        <option value="25">3 - Isla Vista </option>
        <option value="40">4 - Parlier </option>
        <!-- Classe média -->
        <option value="70">5 - Fremont </option>
        <option value="75">6 - San Ramon </option>
        <!-- Ricas -->
        <option value="90">7 - Atherton </option>
        <option value="88">8 - Los Altos Hills </option>
      </select>
      <button onclick="perguntaEducacao()">Próximo</button>
    </div>

    <div id="educacaoDiv" class="hidden">
      <div class="texto">3️⃣ Qual o seu nível de escolaridade?</div>
      <select id="educacao">
        <option value="20">1 - Menos que ensino médio</option>
        <option value="40">2 - Ensino médio completo</option>
        <option value="55">3 - Algum curso universitário</option>
        <option value="65">4 - Grau de associado</option>
        <option value="80">5 - Bacharelado</option>
        <option value="95">6 - Pós-graduação</option>
      </select>
      <button onclick="analisar()">Finalizar</button>
    </div>

    <div id="barraContainer" class="hidden">
      <div class="chance"> Chance de Sobrevivência</div>
      <div class="barra-container"><div class="barra verde" id="barraSobreviver"></div></div>
      <div class="chance"> Chance de Sucesso</div>
      <div class="barra-container"><div class="barra azul" id="barraSucesso"></div></div>
    </div>

    <div class="resultado" id="resultado"></div>
  </div>

  <script>
    function perguntaEtnia() {
      const nome = document.getElementById("nomeInput").value.trim();
      if (nome === "") {
        alert("Por favor, digite seu nome!");
        return;
      }
      document.getElementById("texto").innerHTML = `Prazer, ${nome}! Vamos começar sua análise.`;
      document.getElementById("nomeInput").classList.add("hidden");
      document.getElementById("nomeBtn").classList.add("hidden");
      setTimeout(() => document.getElementById("etniaDiv").classList.remove("hidden"), 800);
    }

    function perguntaCidade() {
      document.getElementById("etniaDiv").classList.add("hidden");
      setTimeout(() => document.getElementById("cidadeDiv").classList.remove("hidden"), 500);
    }

    function perguntaEducacao() {
      document.getElementById("cidadeDiv").classList.add("hidden");
      setTimeout(() => document.getElementById("educacaoDiv").classList.remove("hidden"), 500);
    }

    function analisar() {
      document.getElementById("educacaoDiv").classList.add("hidden");
      document.getElementById("barraContainer").classList.remove("hidden");
      const resultado = document.getElementById("resultado");
      resultado.innerHTML = " Analisando dados...";
      const barraSobreviver = document.getElementById("barraSobreviver");
      const barraSucesso = document.getElementById("barraSucesso");
      barraSobreviver.style.width = "0%";
      barraSucesso.style.width = "0%";

      const etnia = parseFloat(document.getElementById("etnia").value);
      const cidade = parseFloat(document.getElementById("cidade").value);
      const educacao = parseFloat(document.getElementById("educacao").value);

      setTimeout(() => {
        // Cálculos equilibrados
        const chanceSobreviver = Math.min(
          100,
          ((cidade * 0.5) + (educacao * 0.4) + (etnia * 0.1)).toFixed(1)
        );
        const chanceSucesso = Math.min(
          100,
          ((educacao * 0.6) + (cidade * 0.3) + (etnia * 0.1)).toFixed(1)
        );

        barraSobreviver.style.width = `${chanceSobreviver}%`;
        barraSucesso.style.width = `${chanceSucesso}%`;

        resultado.innerHTML = `
          <b>Análise concluída!</b><br><br>
          Etnia: ${etnia}%<br>
          Cidade: ${cidade}%<br>
          Escolaridade: ${educacao}%<br><br>
          <b> Chance de Sobrevivência:</b> ${chanceSobreviver}%<br>
          <b> Chance de Sucesso:</b> ${chanceSucesso}%<br>
        `;
      }, 1500);
    }
  </script>
</body>
</html>
